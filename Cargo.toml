[package]
name = "pangirbot"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
scraper = "0.29.0"
secrecy = "0.10.3"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ureq = { version = "3.5.2", features = ["cookies"] }
zeroize = "1.9.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["process"] }
